name: health-ier-dev

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthier_demo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-healthier_dev}
      # Shared synthetic development default only; production still requires a private password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthier_dev_only}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev:
