# Additive local EDGE storage only: docker compose -f compose.prod.yaml -f compose.attachments.yaml ...
# Source/configuration preparation does not authorize changing retained deployments.
services:
  server:
    environment:
      HISTORICAL_S3_ENDPOINT: http://minio:9000
      HISTORICAL_S3_BUCKET: clinic-historical-scans
      HISTORICAL_S3_REGION: us-east-1
      HISTORICAL_S3_FORCE_PATH_STYLE: 'true'
      HISTORICAL_S3_ACCESS_KEY: ${HISTORICAL_S3_ACCESS_KEY:?Set a private attachment application access key}
      HISTORICAL_S3_SECRET_KEY: ${HISTORICAL_S3_SECRET_KEY:?Set a private attachment application secret}
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    # User selected local MinIO; archived upstream limits this implementation to demo use.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a private local MinIO administrator}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a private local MinIO administrator password}
      MINIO_BROWSER: 'off'
    volumes:
      - historical_minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a private local MinIO administrator}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a private local MinIO administrator password}
      HISTORICAL_S3_ACCESS_KEY: ${HISTORICAL_S3_ACCESS_KEY:?Set a private attachment application access key}
      HISTORICAL_S3_SECRET_KEY: ${HISTORICAL_S3_SECRET_KEY:?Set a private attachment application secret}
    volumes:
      - ./deploy/historical-minio-init.sh:/setup/minio-init.sh:ro
      - historical_minio_init:/state
    entrypoint: [/bin/sh, /setup/minio-init.sh]
    restart: 'no'

volumes:
  historical_minio:
  historical_minio_init:
